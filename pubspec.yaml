name: esdcustomer
description: Electronics Sales Delhi - Customer App
publish_to: 'none'
version: 1.0.2+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management + local storage (same pattern as your ESD ERP app)
  get: ^4.6.6
  get_storage: ^2.1.1

  # Networking
  dio: ^5.4.0

  # UI / UX
  flutter_easyloading: ^3.0.5
  pin_code_fields: ^8.0.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.2.5
  image_picker: ^1.1.2
  file_picker: ^8.0.0+1
  permission_handler: ^11.3.1
  open_filex: ^4.4.0
  fluttertoast: ^8.2.4
  connectivity_plus: ^6.0.3
  share_plus: ^12.0.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
